<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02122c"/>
      <stop offset="100%" stop-color="#010a18"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0AE7F7"/>
      <stop offset="100%" stop-color="#129FD9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#0AE7F7" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Glowing Code Symbol < / > -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 46 44 L 28 64 L 46 84" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <path d="M 72 40 L 56 88" fill="none" stroke="#00E676" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 82 44 L 100 64 L 82 84" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
